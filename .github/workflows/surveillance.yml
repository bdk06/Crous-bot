name: Surveillance CROUS Nice

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  surveillance:
    runs-on: ubuntu-latest
    concurrency:
      group: crous-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Lancer un cycle de surveillance
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ONCE: "1"
        run: python crous_watch.py

      - name: Committer l'état (logements déjà vus)
        run: |
          git config user.name "crous-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add logements_vus.json
          git diff --staged --quiet || git commit -m "Mise à jour état [skip ci]"
          git push
